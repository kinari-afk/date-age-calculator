<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoCalc - 暦と年齢の計算ダッシュボード</title>
  
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- ReactとBabel (ブラウザでReactを動かすための仕組み) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ブラウザ標準の矢印（スピンボタン）を非表示にする */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    /* スクロールバーを隠すユーティリティクラス */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* フォント調整 (SF Pro / Inter的なクリーンさ) */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#F5F5F7] text-gray-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- アイコンコンポーネント ---
    const Calendar = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const User = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const ArrowRightLeft = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>;
    const CalendarDays = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>;
    const HistoryIcon = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>;
    const RefreshCcw = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>;
    const FileTextIcon = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
    const GiftIcon = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>;
    const XIcon = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>;
    const SettingsIcon = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
    const LeafIcon = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>;

    // 干支を取得する関数
    const getEto = (year) => {
      const etoList = ['申', '酉', '戌', '亥', '子', '丑', '寅', '卯', '辰', '巳', '午', '未'];
      return etoList[year % 12];
    };

    // 和暦ヘルパー関数
    const getWarekiParts = (date) => {
      if (!date || isNaN(date.getTime())) return { era: '令和', year: '1', month: '1', day: '1' };
      try {
        const formatted = new Intl.DateTimeFormat('ja-JP-u-ca-japanese', { era: 'long', year: 'numeric' }).format(date);
        let era = '令和';
        let wYear = '1';
        const match = formatted.match(/(明治|大正|昭和|平成|令和)(.+?)年/);
        if (match) {
          era = match[1];
          wYear = match[2] === '元' ? '1' : match[2];
        }
        return { era, year: wYear, month: String(date.getMonth() + 1), day: String(date.getDate()) };
      } catch (e) {
        return { era: '令和', year: '1', month: '1', day: '1' };
      }
    };

    const getExactDiff = (start, end) => {
      let isNegative = false;
      let s = new Date(start);
      let e = new Date(end);
      s.setHours(0,0,0,0);
      e.setHours(0,0,0,0);

      if (s > e) {
        isNegative = true;
        const temp = s;
        s = e;
        e = temp;
      }
      
      let years = e.getFullYear() - s.getFullYear();
      let months = e.getMonth() - s.getMonth();
      let days = e.getDate() - s.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonth = new Date(e.getFullYear(), e.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }
      return { years, months, days, isNegative };
    };

    // --- コンポーネント群 (デザインアップデート版) ---
    const NumberInputWithButtons = ({ value, onChange, min, max, width = "w-16 sm:w-20", placeholder, isSmall = false }) => {
      const handleDecrement = () => {
        let val = value === '' ? (min !== undefined ? min : 0) : parseInt(value, 10);
        if (min !== undefined && val <= min) return;
        onChange({ target: { value: val - 1 } });
      };
      const handleIncrement = () => {
        let val = value === '' ? (min !== undefined ? min : 0) : parseInt(value, 10);
        if (max !== undefined && val >= max) return;
        onChange({ target: { value: val + 1 } });
      };

      const containerClass = isSmall 
        ? "inline-flex items-center flex-shrink-0 mx-0 sm:mx-1 bg-[#F5F5F7] rounded-lg sm:rounded-xl overflow-hidden border border-transparent focus-within:border-gray-300 transition-colors"
        : "inline-flex items-center flex-shrink-0 mx-1 bg-[#F5F5F7] rounded-xl overflow-hidden border border-transparent focus-within:border-gray-300 transition-colors";
        
      const btnClass = isSmall
        ? "px-1.5 sm:px-2 py-1 text-gray-400 hover:text-gray-800 hover:bg-gray-200 transition-colors font-bold text-base sm:text-lg select-none active:bg-gray-300 flex items-center justify-center"
        : "px-3 py-1.5 text-gray-400 hover:text-gray-800 hover:bg-gray-200 transition-colors font-bold text-lg select-none active:bg-gray-300 flex items-center justify-center";
        
      const inputClassName = isSmall
        ? `${width} p-0.5 text-center outline-none font-semibold text-base sm:text-xl text-gray-900 bg-transparent rounded-none`
        : `${width} p-1 text-center outline-none font-semibold text-lg sm:text-xl text-gray-900 bg-transparent rounded-none`;

      return (
        <div className={containerClass}>
          <button type="button" onClick={handleDecrement} className={btnClass} aria-label="減らす">−</button>
          <input type="number" inputMode="numeric" min={min} max={max} className={inputClassName} value={value} onChange={onChange} placeholder={placeholder} />
          <button type="button" onClick={handleIncrement} className={btnClass} aria-label="増やす">＋</button>
        </div>
      );
    };

    const selectClass = "mx-1 px-2 py-1.5 bg-[#F5F5F7] rounded-xl outline-none font-semibold text-lg sm:text-xl text-gray-900 cursor-pointer transition-colors hover:bg-gray-200 focus:ring-2 focus:ring-gray-200 appearance-none";

    const Card = ({ title, icon, children }) => (
      <div className="bg-white rounded-[24px] shadow-[0_2px_20px_rgba(0,0,0,0.04)] border border-gray-100 flex flex-col h-full overflow-hidden transition-transform duration-300 hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)]">
        <div className="px-6 pt-6 pb-2 flex items-center">
          <div className="p-2 bg-gray-50 rounded-xl text-gray-600 mr-3 border border-gray-100">
            {icon}
          </div>
          <h3 className="text-lg font-bold text-gray-900 tracking-tight">{title}</h3>
        </div>
        <div className="px-6 pb-6 pt-2 flex-grow flex flex-col">
          {children}
        </div>
      </div>
    );

    const ResultBox = ({ main, sub1, sub2 }) => {
      if (main === null || main === undefined || main === '') {
        return (
          <div className="mt-auto pt-6">
            <div className="bg-[#F5F5F7] rounded-[20px] p-6 text-center text-sm font-medium text-gray-400">
              数値を入力してください
            </div>
          </div>
        );
      }
      return (
        <div className="mt-auto pt-6">
          <div className="bg-[#F5F5F7] rounded-[20px] p-5 text-center transition-all duration-300 flex flex-col items-center justify-center min-h-[120px]">
            <div className="text-3xl sm:text-4xl font-bold text-gray-900 tracking-tight leading-tight">
              {main}
            </div>
            {sub1 && <div className="text-base sm:text-lg font-medium text-gray-500 mt-1">{sub1}</div>}
            {sub2 && (
              <div className="mt-3">
                <span className="text-xs font-semibold text-gray-500 bg-white px-3 py-1.5 rounded-full border border-gray-200 shadow-sm">
                  {sub2}
                </span>
              </div>
            )}
          </div>
        </div>
      );
    };

    function App() {
      // --- 状態管理 ---
      const [activeTab, setActiveTab] = useState('calc'); // 'calc' | 'duration' | 'timeline'

      const getTodayString = () => {
        const today = new Date();
        const jstOffset = 9 * 60 * 60 * 1000;
        const jstDate = new Date(today.getTime() + (today.getTimezoneOffset() * 60000) + jstOffset);
        return jstDate.toISOString().split('T')[0];
      };

      const [baseDateStr, setBaseDateStr] = useState(() => getTodayString());
      const [baseDateInputType, setBaseDateInputType] = useState('seireki');
      const [warekiInput, setWarekiInput] = useState(() => getWarekiParts(new Date(baseDateStr)));

      useEffect(() => {
        const d = new Date(baseDateStr);
        if (!isNaN(d.getTime())) {
          setWarekiInput(getWarekiParts(d));
        }
      }, [baseDateStr]);

      const resetToToday = () => setBaseDateStr(getTodayString());
      const resetTargetDateToToday = () => setTargetDateInput(getTodayString());

      const handleWarekiInput = (field, value) => {
        const newWareki = { ...warekiInput, [field]: value };
        setWarekiInput(newWareki);
        const y = parseInt(newWareki.year, 10);
        const m = parseInt(newWareki.month, 10);
        const d = parseInt(newWareki.day, 10);
        if (!isNaN(y) && !isNaN(m) && !isNaN(d)) {
          const baseYear = { '令和': 2018, '平成': 1988, '昭和': 1925, '大正': 1911, '明治': 1867 }[newWareki.era] || 2018;
          const seirekiYear = baseYear + y;
          const newDate = new Date(seirekiYear, m - 1, d);
          if (!isNaN(newDate.getTime())) {
             setBaseDateStr(`${newDate.getFullYear()}-${String(newDate.getMonth() + 1).padStart(2, '0')}-${String(newDate.getDate()).padStart(2, '0')}`);
          }
        }
      };

      // 各ツールの入力状態
      const [diffYears, setDiffYears] = useState(10);
      const [diffYearsType, setDiffYearsType] = useState('after');
      const [targetAge, setTargetAge] = useState(50);
      const [targetYear, setTargetYear] = useState(() => new Date().getFullYear() + 10);
      const [diffDaysTool, setDiffDaysTool] = useState(100);
      const [diffDaysToolType, setDiffDaysToolType] = useState('after');
      
      const [targetDateInput, setTargetDateInput] = useState(() => {
        const d = new Date(getTodayString());
        d.setDate(d.getDate() + 100);
        return d.toISOString().split('T')[0];
      });
      const [includeBothEnds, setIncludeBothEnds] = useState(true);

      const [targetDateInputType, setTargetDateInputType] = useState('seireki');
      const [targetWarekiInput, setTargetWarekiInput] = useState(() => getWarekiParts(new Date(targetDateInput)));
      
      const [showResumeModal, setShowResumeModal] = useState(false);
      const [showOiwaiModal, setShowOiwaiModal] = useState(false);
      const [showMemorialModal, setShowMemorialModal] = useState(false);

      useEffect(() => {
        const d = new Date(targetDateInput);
        if (!isNaN(d.getTime())) {
          setTargetWarekiInput(getWarekiParts(d));
        }
      }, [targetDateInput]);

      const handleTargetWarekiInput = (field, value) => {
        const newWareki = { ...targetWarekiInput, [field]: value };
        setTargetWarekiInput(newWareki);
        const y = parseInt(newWareki.year, 10);
        const m = parseInt(newWareki.month, 10);
        const d = parseInt(newWareki.day, 10);
        if (!isNaN(y) && !isNaN(m) && !isNaN(d)) {
          const baseYear = { '令和': 2018, '平成': 1988, '昭和': 1925, '大正': 1911, '明治': 1867 }[newWareki.era] || 2018;
          const seirekiYear = baseYear + y;
          const newDate = new Date(seirekiYear, m - 1, d);
          if (!isNaN(newDate.getTime())) {
             setTargetDateInput(`${newDate.getFullYear()}-${String(newDate.getMonth() + 1).padStart(2, '0')}-${String(newDate.getDate()).padStart(2, '0')}`);
          }
        }
      };

      // --- 計算ロジック ---
      const baseDate = new Date(baseDateStr);
      const isValidBaseDate = !isNaN(baseDate.getTime()) && baseDateStr !== '';

      const getWareki = (date, includeDay = false) => {
        if (!date || isNaN(date.getTime())) return '';
        try {
          const options = { era: 'long', year: 'numeric' };
          if (includeDay) { options.month = 'long'; options.day = 'numeric'; }
          return new Intl.DateTimeFormat('ja-JP-u-ca-japanese', options).format(date);
        } catch (e) { return ''; }
      };

      const getSeireki = (date, includeDay = false, includeDayOfWeek = false) => {
        if (!date || isNaN(date.getTime())) return '';
        if (includeDay) {
          let str = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
          if (includeDayOfWeek) {
            const weeks = ['日', '月', '火', '水', '木', '金', '土'];
            str += ` (${weeks[date.getDay()]})`;
          }
          return str;
        }
        return `${date.getFullYear()}年`;
      };

      const handleNumberChange = (setter) => (e) => {
        const val = e.target.value;
        if (val === '') { setter(''); return; }
        setter(isNaN(parseInt(val, 10)) ? '' : parseInt(val, 10));
      };

      let diffYearsResultDate = null;
      if (isValidBaseDate && diffYears !== '') {
        diffYearsResultDate = new Date(baseDate);
        diffYearsResultDate.setFullYear(diffYearsResultDate.getFullYear() + (diffYears * (diffYearsType === 'after' ? 1 : -1)));
      }

      let targetAgeResultDate = null;
      if (isValidBaseDate && targetAge !== '') {
        targetAgeResultDate = new Date(baseDate);
        targetAgeResultDate.setFullYear(targetAgeResultDate.getFullYear() + targetAge);
      }

      let targetYearDiff = null, targetYearDate = null;
      if (isValidBaseDate && targetYear !== '') {
        targetYearDiff = targetYear - baseDate.getFullYear();
        targetYearDate = new Date(baseDate);
        targetYearDate.setFullYear(targetYear);
      }

      let diffDaysToolResultDate = null;
      if (isValidBaseDate && diffDaysTool !== '') {
        diffDaysToolResultDate = new Date(baseDate);
        diffDaysToolResultDate.setDate(diffDaysToolResultDate.getDate() + (diffDaysTool * (diffDaysToolType === 'after' ? 1 : -1)));
      }

      let targetDateBetween = null, daysDifference = null, exactDiff = null;
      if (isValidBaseDate && targetDateInput !== '') {
        targetDateBetween = new Date(targetDateInput);
        if (!isNaN(targetDateBetween.getTime())) {
          const start = new Date(baseDate); start.setHours(0, 0, 0, 0);
          const end = new Date(targetDateBetween); end.setHours(0, 0, 0, 0);
          const diffTime = end.getTime() - start.getTime();
          let rawDiff = Math.round(Math.abs(diffTime) / (1000 * 60 * 60 * 24));
          daysDifference = includeBothEnds ? rawDiff + 1 : rawDiff;
          exactDiff = getExactDiff(start, end);
        }
      }

      // 年表データ
      const generateResumeTimeline = () => {
        if (!isValidBaseDate) return [];
        const isEarly = baseDate.getMonth() < 3 || (baseDate.getMonth() === 3 && baseDate.getDate() === 1);
        const startY = isEarly ? baseDate.getFullYear() - 1 : baseDate.getFullYear();
        const createEntry = (yearAdd, month, label) => {
          const d = new Date(startY + yearAdd, month - 1, 1);
          return { year: d.getFullYear(), wareki: getWareki(d), month, label };
        };
        return [
          createEntry(7, 4, '小学校 入学'), createEntry(13, 3, '小学校 卒業'),
          createEntry(13, 4, '中学校 入学'), createEntry(16, 3, '中学校 卒業'),
          createEntry(16, 4, '高等学校 入学'), createEntry(19, 3, '高等学校 卒業'),
          createEntry(19, 4, '大学 入学'), createEntry(23, 3, '大学 卒業'),
        ];
      };

      const generateOiwaiTimeline = () => {
        if (!isValidBaseDate) return [];
        const createEntry = (age, label, description) => {
          const d = new Date(baseDate); d.setFullYear(d.getFullYear() + age);
          return { age, year: d.getFullYear(), wareki: getWareki(d), label, description };
        };
        return [
          createEntry(60, '還暦 (かんれき)', '満60歳。十干十二支が一巡して元の暦に還ることから。'),
          createEntry(70, '古希 (こき)', '満70歳。唐の詩人・杜甫の詩に由来。'),
          createEntry(77, '喜寿 (きじゅ)', '満77歳。「喜」の草書体が七十七と読めることから。'),
          createEntry(80, '傘寿 (さんじゅ)', '満80歳。「傘」の略字が八十と読めることから。'),
          createEntry(88, '米寿 (べいじゅ)', '満88歳。「米」の字を分解すると八十八となることから。'),
          createEntry(90, '卒寿 (そつじゅ)', '満90歳。「卒」の略字が九十と読めることから。'),
          createEntry(99, '白寿 (はくじゅ)', '満99歳。「百」の字から一を取ると白になることから。'),
          createEntry(100, '百寿 (ひゃくじゅ)', '満100歳のお祝い。紀寿（きじゅ）とも呼ばれます。')
        ];
      };

      const generateMemorialTimeline = () => {
        if (!isValidBaseDate) return [];
        
        const createDayEntry = (daysAdd, label, description) => {
          const d = new Date(baseDate);
          d.setDate(d.getDate() + (daysAdd - 1));
          return {
            date: getSeireki(d, true, true),
            wareki: getWareki(d, true),
            label,
            description,
          };
        };

                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {showOiwaiModal && (
            <div className="fixed inset-0 bg-gray-900/40 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity animate-in fade-in" onClick={() => setShowOiwaiModal(false)}>
              <div className="bg-white rounded-t-[32px] sm:rounded-[32px] shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom-10 sm:slide-in-from-bottom-0 sm:zoom-in-95 duration-300" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between p-6 border-b border-gray-100">
                  <h3 className="text-xl font-bold text-gray-900 flex items-center">
                    <GiftIcon className="w-6 h-6 mr-3 text-gray-400" />
                    長寿のお祝い年表
                  </h3>
                  <button onClick={() => setShowOiwaiModal(false)} className="p-2 bg-[#F5F5F7] text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-full transition-colors">
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-6 overflow-y-auto hide-scrollbar">
                  <div className="bg-[#F5F5F7] rounded-2xl p-4 mb-6 text-sm text-gray-600">
                    基準日（<span className="font-bold text-gray-900">{isValidBaseDate ? getSeireki(baseDate) : '無効な日付'}</span> 生まれ）を元に計算しています。<br/>
                    <span className="text-xs text-gray-400 mt-1 block">※満年齢に基づいた年を表示しています。</span>
                  </div>
                  <div className="space-y-3">
                    {generateOiwaiTimeline().map((item, i) => (
                      <div key={i} className="p-4 bg-white border border-gray-100 rounded-2xl flex flex-col sm:flex-row sm:items-center gap-4">
                        <div className="flex items-baseline min-w-[80px]">
                          <span className="text-3xl font-black text-gray-900">{item.age}</span>
                          <span className="text-sm font-bold text-gray-400 ml-1">歳</span>
                        </div>
                        <div>
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-lg font-bold text-gray-900">{item.label}</span>
                            <span className="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded-md">{item.year}年 ({item.wareki})</span>
                          </div>
                          <p className="text-sm text-gray-500 font-medium">{item.description}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
          
          {/* 法要・年忌モーダルUI */}
          {showMemorialModal && (
            <div className="fixed inset-0 bg-gray-900/40 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity animate-in fade-in" onClick={() => setShowMemorialModal(false)}>
              <div className="bg-white rounded-t-[32px] sm:rounded-[32px] shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom-10 sm:slide-in-from-bottom-0 sm:zoom-in-95 duration-300" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between p-6 border-b border-gray-100">
                  <h3 className="text-xl font-bold text-gray-900 flex items-center">
                    <LeafIcon className="w-6 h-6 mr-3 text-gray-400" />
                    法要・年忌表 (忌日・回忌計算)
                  </h3>
                  <button onClick={() => setShowMemorialModal(false)} className="p-2 bg-[#F5F5F7] text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-full transition-colors">
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-6 overflow-y-auto hide-scrollbar">
                  <div className="bg-[#F5F5F7] rounded-2xl p-4 mb-6 text-sm text-gray-600">
                    基準日（<span className="font-bold text-gray-900">{isValidBaseDate ? getSeireki(baseDate) : '無効な日付'}</span>）を<span className="font-bold text-gray-900">命日</span>として計算しています。<br/>
                    <span className="text-xs text-gray-400 mt-1 block">※一般的な数え方（初七日などは命日を1日目とする、三回忌以降は満年数-1）に基づいています。宗派や地域によって異なる場合があります。</span>
                  </div>
                  <div className="space-y-3">
                    {generateMemorialTimeline().map((item, i) => (
                      <div key={i} className="p-4 bg-white border border-gray-100 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:border-gray-300 transition-all">
                        <div className="flex-1">
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-lg font-bold text-gray-900">{item.label}</span>
                          </div>
                          <p className="text-sm text-gray-500 font-medium">{item.description}</p>
                        </div>
                        <div className="flex flex-col items-start sm:items-end text-left sm:text-right bg-[#F5F5F7] px-4 py-3 rounded-xl min-w-[160px]">
                           <span className="text-base font-bold text-gray-900">{item.date}</span>
                           <span className="text-xs font-bold text-gray-500 mt-1">{item.wareki}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
          {/* --- モーダルUI 終了 --- */}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
